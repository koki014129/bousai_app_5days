<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    h1 {
      color: blue;
    }
  </style>
</head>
<body class="{{ body_class or '' }}">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">防災アプリ</div>
      <button class="menu-toggle" aria-label="メニュー" aria-expanded="false">☰</button>
    </div>
  </header>

  <nav class="main-nav" id="mainNav">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <span>ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
      <a href="/logout">ログアウト</a>
    {% else %}
      <span>未ログイン</span>
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>

  <style>
    :root {
      --brand-blue: #0d4f8a;
      --brand-blue-deep: #0a3d70;
      --surface: #f3f5f7;
      --card: #f0f2f4;
      --card-border: #dfe5ea;
      --text: #1e2d3d;
      --muted: #5f6f7d;
      --accent: #1e90ff;
      --success: #2db46d;
      --shadow: rgba(15, 40, 70, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    .app-header {
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-deep) 100%);
      height: 70px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand {
      color: #fff;
      font-size: clamp(1.7rem, 2.2vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .menu-toggle {
      background: transparent;
      color: #fff;
      border: none;
      font-size: 2.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-nav {
      max-width: 1180px;
      margin: 8px auto 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      flex-wrap: wrap;
      font-size: 0.96rem;
    }

    .main-nav a,
    .main-nav span {
      color: var(--text);
      text-decoration: none;
    }

    body.homepage .main-nav {
      display: none;
      position: absolute;
      right: 24px;
      top: 74px;
      z-index: 10;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #d9e1e8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      min-width: 220px;
    }

    body.homepage .main-nav.open {
      display: flex;
    }

    .page-main {
      max-width: 980px;
      margin: 18px auto 40px;
      padding: 0 16px;
    }

    body.homepage .page-main {
      max-width: 820px;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggle = document.querySelector('.menu-toggle');
      const nav = document.getElementById('mainNav');
      if (!toggle || !nav) return;

      toggle.addEventListener('click', function () {
        const isOpen = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(isOpen));
      });
    });
  </script>
</body>
</html>
