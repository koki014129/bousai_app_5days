{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body.homepage {
    background: #eef1f3;
  }

  .home-shell {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .home-panel {
    background: rgba(255, 255, 255, 0.22);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: 0 3px 10px var(--shadow);
    padding: 18px 18px 14px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .title-wrap {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--brand-blue-deep);
    font-size: clamp(1.15rem, 2vw, 1.7rem);
  }

  .title-wrap .marker {
    display: inline-flex;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(180deg, #1d7ee8, #0d4f8a);
    position: relative;
    box-shadow: 0 0 0 4px rgba(17, 95, 170, 0.12);
  }

  .title-wrap .marker::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .map-card {
    background: #dfeaf0;
    border: 1px solid #c6d1d6;
    border-radius: 12px;
    overflow: hidden;
    height: 390px;
    width: 100%;
  }

  #shelterMap {
    width: 100%;
    height: 100%;
  }

  .weather-card {
    padding-top: 12px;
  }

  .refresh-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    background: rgba(36, 172, 109, 0.12);
    color: #1e9c5d;
    border: 1px solid rgba(30, 156, 93, 0.15);
    padding: 6px 12px;
    font-size: 0.92rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .refresh-badge .icon {
    font-size: 1rem;
  }

  .weather-body {
    border-top: 1px solid #dce3e8;
    padding-top: 18px;
    margin-top: 8px;
  }

  .weather-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    color: var(--brand-blue-deep);
    margin-bottom: 14px;
  }

  .weather-status .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(45, 180, 109, 0.18);
  }

  .weather-note, .weather-meta {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.8;
  }

  .weather-meta {
    margin-top: 12px;
  }

  .weather-meta strong {
    color: var(--text);
  }

  .weather-list {
    margin: 0;
    padding-left: 1.2rem;
    color: var(--text);
    line-height: 1.8;
  }

  @media (max-width: 640px) {
    .page-main { padding: 0 10px; }
    .home-panel { padding: 14px 12px; }
    .section-head { flex-direction: column; align-items: flex-start; }
    .map-card { height: 300px; }
  }
</style>

<div class="home-shell">
  <section class="home-panel map-panel">
    <div class="section-head">
      <div class="title-wrap">
        <span class="marker" aria-hidden="true"></span>
        <span>避難所マップ</span>
      </div>
    </div>
    <div class="map-card">
      <div id="shelterMap"></div>
    </div>
  </section>

  <section class="home-panel weather-card">
    <div class="section-head">
      <div class="title-wrap">
        <span class="marker" aria-hidden="true" style="background: linear-gradient(180deg, #3ab5ff, #0d4f8a);"></span>
        <span>青森市 気象警報・注意報</span>
      </div>
      <div class="refresh-badge"><span class="icon">↻</span><span>10分おき自動更新</span></div>
    </div>

    <div class="weather-body" id="weatherContent">
      <div class="weather-status"><span class="dot"></span><span>読み込み中...</span></div>
    </div>
  </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = L.map('shelterMap', {
    zoomControl: true,
    attributionControl: false,
    minZoom: 4,
    maxZoom: 18
  }).setView([36.2048, 138.2529], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    referrerPolicy: 'strict-origin-when-cross-origin'
  }).addTo(map);

  function renderWeather(data) {
    const weatherContent = document.getElementById('weatherContent');

    if (data.error) {
      weatherContent.innerHTML = '<div class="weather-note">気象情報の取得に失敗しました</div>';
      return;
    }

    if (data.warnings && data.warnings.length > 0) {
      const list = data.warnings.map(item => {
        return `<li>${item.name}（${item.status}）</li>`;
      }).join('');

      weatherContent.innerHTML = `
        <div class="weather-status"><span class="dot"></span><span>${data.area_name || '青森市'}</span></div>
        <ul class="weather-list">${list}</ul>
        <div class="weather-meta">最終確認: <strong>${data.last_fetch_time || '更新中...'}</strong></div>
        <div class="weather-meta">気象庁最終発表: <strong>${data.report_time || '不明'}</strong></div>
      `;
      return;
    }

    weatherContent.innerHTML = `
      <div class="weather-status"><span class="dot"></span><span>${data.area_name || '青森市'}</span></div>
      <div class="weather-note">現在、警報・注意報は発表されていません</div>
      <div class="weather-meta">最終確認: <strong>${data.last_fetch_time || '更新中...'}</strong></div>
      <div class="weather-meta">気象庁最終発表: <strong>${data.report_time || '不明'}</strong></div>
    `;
  }

  function updateWeatherWarnings() {
    fetch('/api/weather_warnings')
      .then(response => response.json())
      .then(data => {
        renderWeather(data);
      })
      .catch(() => {
        document.getElementById('weatherContent').innerHTML = '<div class="weather-note">気象情報の取得に失敗しました</div>';
      });
  }

  updateWeatherWarnings();
  setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
